<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7F1023">
    <title>Create Event | AUK Events</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/create-event.css">
    <script>
        (function () {
            const language = localStorage.getItem("auk-language") || "en";
            const theme = localStorage.getItem("auk-theme") || "light";
            document.documentElement.lang = language === "ar" ? "ar" : "en";
            document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
            document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
        })();
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script defer src="js/navbar.js"></script>
    <script defer src="js/create-event.js"></script>
</head>

<body>
    <!-- NAVIGATION -->
    <header class="site-header">
        <nav class="container modern-navbar" aria-label="Main navigation">
            <!-- LOGO -->
            <a href="home.html" class="logo">
                <span class="logo-icon" aria-hidden="true">A</span>
                <span>AUK Events</span>
            </a>

            <!-- MAIN NAVIGATION LINKS -->
            <div class="modern-nav-links" id="nav-links">
                <a href="home.html" class="nav-link" data-i18n="home">
                    Home
                </a>

                <a href="events.html" class="nav-link" data-i18n="events">
                    Events
                </a>

                <a href="my-bookings.html" class="nav-link" id="my-bookings-link" data-i18n="myBookings" hidden>
                    My Bookings
                </a>

                <!-- COORDINATOR DROPDOWN -->
                <div class="nav-dropdown" id="coordinator-menu" hidden>
                    <button type="button" class="nav-dropdown-toggle active" aria-expanded="false"
                        aria-controls="coordinator-dropdown">
                        <span data-i18n="coordinator">Coordinator</span>
                        <span aria-hidden="true">⌄</span>
                    </button>

                    <div class="nav-dropdown-menu" id="coordinator-dropdown">
                        <a href="coordinator-events.html" id="coordinator-events-link" data-i18n="coordinatorEvents">
                            Coordinator Events
                        </a>
                        <a href="venues.html" id="venues-link" data-i18n="venues">
                            Venues
                        </a>
                        <a href="create-event.html" id="create-event-btn" class="active" data-i18n="createEvent" aria-current="page">
                            Create Event
                        </a>
                        <a href="create-venue.html" id="create-venue-btn" data-i18n="createVenue">
                            Create Venue
                        </a>
                        <a href="assign-organizers.html" id="assign-organizers-btn" data-i18n="assignOrganizers">
                            Assign Organizers
                        </a>
                    </div>
                </div>
            </div>

            <!-- RIGHT SIDE NAVIGATION -->
            <div class="modern-nav-actions">
                <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
                    🌙
                </button>

                <button class="icon-btn" id="language-toggle" type="button" aria-label="Change language" title="Change language">
                    العربية
                </button>

                <!-- GUEST AUTHENTICATION -->
                <a href="home.html?signin=true" class="nav-auth-link" id="signin-btn" data-i18n="signIn">
                    Sign In
                </a>
                <a href="home.html?signup=true" class="nav-signup-btn" id="signup-btn" data-i18n="signUp">
                    Sign Up
                </a>

                <!-- USER ACCOUNT DROPDOWN -->
                <div class="nav-dropdown" id="user-menu" hidden>
                    <button type="button" class="nav-dropdown-toggle user-menu-toggle" aria-expanded="false"
                        aria-controls="user-dropdown">
                        <span aria-hidden="true">👤</span>
                        <span data-i18n="account">Account</span>
                        <span aria-hidden="true">⌄</span>
                    </button>

                    <div class="nav-dropdown-menu nav-dropdown-right" id="user-dropdown">
                        <a href="profile.html" id="profile-link" data-i18n="profile">
                            My Profile
                        </a>
                        <button type="button" id="signout-btn" data-i18n="signOut">
                            Sign Out
                        </button>
                    </div>
                </div>
            </div>

            <!-- MOBILE MENU -->
            <button class="icon-btn mobile-menu-toggle" id="menu-toggle" type="button" aria-label="Toggle navigation"
                aria-controls="nav-links" aria-expanded="false">
                ☰
            </button>
        </nav>
    </header>

    <main class="container">
        <section class="create-event-card" aria-labelledby="create-event-title">
            <div class="section-heading">
                <div>
                    <span class="eyebrow create-event-eyebrow" data-i18n="eyebrow">AUK EVENTS</span>
                    <h1 id="create-event-title" data-i18n="createEventHeading">Create a campus event</h1>
                    <p class="muted" data-i18n="createEventSubtitle">Add the details attendees need to find and reserve seats.</p>
                </div>
                <span class="badge" id="coordinator-badge" data-i18n="coordinator" hidden>Coordinator</span>
            </div>

            <p id="access-message" class="form-message" role="status" aria-live="polite"></p>

            <form id="create-event-form" class="event-form" hidden>
                <div class="form-field form-field-wide">
                    <label for="event-title" data-i18n="eventTitle">Event title</label>
                    <input id="event-title" name="title" type="text" maxlength="150" required>
                </div>

                <div class="form-field form-field-wide">
                    <label for="event-description" data-i18n="description">Description</label>
                    <textarea id="event-description" name="description" maxlength="500" rows="4"></textarea>
                </div>

                <div class="form-field">
                    <label for="event-date" data-i18n="dateLabel">Date</label>
                    <input id="event-date" name="event_date" type="date" required>
                </div>

                <div class="form-field">
                    <label for="event-type" data-i18n="eventType">Event type</label>
                    <select id="event-type" name="event_type" required>
                        <option value="" data-i18n="selectType">Select a type</option>
                        <option value="Play" data-i18n="typePlay">Play</option>
                        <option value="Workshop" data-i18n="typeWorkshop">Workshop</option>
                        <option value="Seminar" data-i18n="typeSeminar">Seminar</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="start-time" data-i18n="startTime">Start time</label>
                    <input id="start-time" name="start_time" type="time" required>
                </div>

                <div class="form-field">
                    <label for="end-time" data-i18n="endTime">End time</label>
                    <input id="end-time" name="end_time" type="time" required>
                </div>

                <div class="form-field">
                    <label for="event-venue" data-i18n="venue">Venue</label>
                    <select id="event-venue" name="venue_id" required>
                        <option value="" data-i18n="loadingVenues">Loading venues...</option>
                    </select>
                </div>

                <div class="form-field">
                    <label for="event-capacity" data-i18n="capacityLabel">Capacity</label>
                    <input id="event-capacity" name="capacity" type="number" min="1" step="1" required>
                </div>

                <div class="form-actions form-field-wide">
                    <a class="btn btn-outline" href="home.html" data-i18n="cancel">Cancel</a>
                    <button class="btn btn-gold" id="create-event-submit" type="submit" data-i18n="submitCreateEvent">Create Event</button>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
