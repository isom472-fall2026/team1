name: Publish GitHub Pages with Branch Previews

on:
  push:
    branches:
      - "**"
  delete:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'delete' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout main and all branches
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble main site and branch previews
        run: |
          mkdir -p site
          git archive origin/main | tar -x -C site

          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/); do
            branch="${ref#refs/remotes/origin/}"
            case "$branch" in
              HEAD|main) continue ;;
            esac

            if ! git cat-file -e "$ref:docs/index.html" 2>/dev/null; then
              continue
            fi

            preview_dir="site/previews/$branch"
            mkdir -p "$preview_dir"
            git archive "$ref" docs | tar -x -C "$preview_dir" --strip-components=1
          done

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
