<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7F1023">

    <title>Venues | AUK Events</title>

    <script>
        (function () {
            try {
                const language = localStorage.getItem("auk-language") || "en";
                const theme = localStorage.getItem("auk-theme") || "light";

                document.documentElement.lang = language === "ar" ? "ar" : "en";
                document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
                document.documentElement.dataset.theme = theme === "dark" ? "dark" : "light";
            } catch (error) {
                console.warn("Preferences unavailable:", error);
            }
        })();
    </script>

    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/coordinator-events.css">
    <link rel="stylesheet" href="css/venues.css">

    <!-- Supabase public client -->
    <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script defer src="js/navbar.js"></script>
    <script defer src="js/venues.js"></script>
</head>

<body>

    <!-- NAVIGATION -->
    <header class="site-header">
        <nav class="container modern-navbar" aria-label="Main navigation">
            <!-- LOGO -->
            <a href="home.html" class="logo">
                <span class="logo-icon" aria-hidden="true">A</span>
                <span>AUK Events</span>
            </a>

            <!-- MAIN NAVIGATION LINKS -->
            <div class="modern-nav-links" id="nav-links">
                <a href="home.html" class="nav-link" data-i18n="home">
                    Home
                </a>

                <a href="events.html" class="nav-link" data-i18n="events">
                    Events
                </a>

                <a href="my-bookings.html" class="nav-link" id="my-bookings-link" data-i18n="myBookings" hidden>
                    My Bookings
                </a>

                <!-- COORDINATOR DROPDOWN -->
                <div class="nav-dropdown" id="coordinator-menu" hidden>
                    <button type="button" class="nav-dropdown-toggle active" aria-expanded="false"
                        aria-controls="coordinator-dropdown">
                        <span data-i18n="coordinator">Coordinator</span>
                        <span aria-hidden="true">⌄</span>
                    </button>

                    <div class="nav-dropdown-menu" id="coordinator-dropdown">
                        <a href="coordinator-events.html" id="coordinator-events-link" data-i18n="coordinatorEvents">
                            Coordinator Events
                        </a>
                        <a href="venues.html" id="venues-link" class="active" data-i18n="venues" aria-current="page">
                            Venues
                        </a>
                        <a href="create-event.html" id="create-event-btn" data-i18n="createEvent">
                            Create Event
                        </a>
                        <a href="create-venue.html" id="create-venue-btn" data-i18n="createVenue">
                            Create Venue
                        </a>
                        <a href="assign-organizers.html" id="assign-organizers-btn" data-i18n="assignOrganizers">
                            Assign Organizers
                        </a>
                    </div>
                </div>
            </div>

            <!-- RIGHT SIDE NAVIGATION -->
            <div class="modern-nav-actions">
                <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle theme">
                    🌙
                </button>

                <button class="icon-btn" id="language-toggle" type="button" aria-label="Change language" title="Change language">
                    العربية
                </button>

                <!-- GUEST AUTHENTICATION -->
                <a href="home.html?signin=true" class="nav-auth-link" id="signin-btn" data-i18n="signIn">
                    Sign In
                </a>
                <a href="home.html?signup=true" class="nav-signup-btn" id="signup-btn" data-i18n="signUp">
                    Sign Up
                </a>

                <!-- USER ACCOUNT DROPDOWN -->
                <div class="nav-dropdown" id="user-menu" hidden>
                    <button type="button" class="nav-dropdown-toggle user-menu-toggle" aria-expanded="false"
                        aria-controls="user-dropdown">
                        <span aria-hidden="true">👤</span>
                        <span data-i18n="account">Account</span>
                        <span aria-hidden="true">⌄</span>
                    </button>

                    <div class="nav-dropdown-menu nav-dropdown-right" id="user-dropdown">
                        <a href="profile.html" id="profile-link" data-i18n="profile">
                            My Profile
                        </a>
                        <button type="button" id="signout-btn" data-i18n="signOut">
                            Sign Out
                        </button>
                    </div>
                </div>
            </div>

            <!-- MOBILE MENU -->
            <button class="icon-btn mobile-menu-toggle" id="menu-toggle" type="button" aria-label="Toggle navigation"
                aria-controls="nav-links" aria-expanded="false">
                ☰
            </button>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container">

        <!-- DASHBOARD HEADER CARD -->
        <section class="coordinator-header-card" aria-labelledby="page-title">

            <div class="section-heading">
                <div>
                    <span class="eyebrow" data-i18n="coordinatorEyebrow">COORDINATOR DASHBOARD</span>
                    <h1 id="page-title" data-i18n="venuesHeading">Campus Venues</h1>
                    <p class="muted" data-i18n="venuesSubtitle">
                        View and search all registered campus venues and capacity limits.
                    </p>
                </div>

                <div class="header-badges">
                    <span class="badge" id="coordinator-badge" data-i18n="coordinator" hidden>Coordinator</span>
                </div>
            </div>

            <p id="access-message" class="form-message" role="status" aria-live="polite"></p>

            <!-- VENUE ROSTER CONTENT (HIDDEN UNTIL VERIFIED COORDINATOR) -->
            <div id="coordinator-content" hidden>

                <!-- SEARCH & CONTROLS -->
                <div class="venues-controls">

                    <form id="venue-search-form" class="venues-search-form" role="search" novalidate>
                        <div class="search-input-group">
                            <input type="text" id="venue-search" class="search-input"
                                placeholder="Search by venue name or location..."
                                data-i18n-placeholder="searchPlaceholder"
                                aria-label="Search venues">
                            <button type="submit" id="search-submit-btn" class="btn btn-search" data-i18n="search">
                                Search
                            </button>
                            <button type="button" id="search-clear-btn" class="btn btn-secondary" data-i18n="clear">
                                Clear
                            </button>
                        </div>
                        <p id="search-feedback" class="search-feedback" role="alert" aria-live="polite"></p>
                    </form>

                    <div class="venues-actions">
                        <a href="create-venue.html" class="btn btn-gold new-venue-link" id="header-create-venue-btn"
                            data-i18n="createVenue">
                            + Create Venue
                        </a>
                    </div>

                </div>

                <!-- VENUES GRID SECTION -->
                <section class="venues-section" aria-label="Venues list">

                    <div id="venues-grid" class="venues-grid" aria-live="polite">
                        <div class="empty-state loading-state" id="venues-loading" data-i18n="loadingVenues">
                            Loading venues...
                        </div>
                    </div>

                </section>

            </div>

        </section>

    </main>

</body>

</html>
