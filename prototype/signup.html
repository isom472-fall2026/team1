<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | AUK Events</title>
    <meta http-equiv="refresh" content="0; url=home.html?signup=true">
    <script>
        (function () {
            const search = window.location.search;
            const target = "home.html?signup=true" + (search ? "&" + search.replace(/^\?/, "") : "");
            window.location.replace(target);
        })();
    </script>
</head>
<body>
    <p>Redirecting to <a href="home.html?signup=true">Sign Up</a>...</p>
</body>
</html>
